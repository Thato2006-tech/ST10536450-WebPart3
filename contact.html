<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSG Blanket Drive | Contact</title>
  <meta name="description" content="Contact the MSG Blanket Drive team. Send us a general message by email.">
  <meta name="keywords" content="MSG contact, Motor Sunday Group, blanket drive Gauteng">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="extra.css">
</head>
<body>
  <header>
    <img src="images/image0013.jpeg" alt="MSG Blanket Drive logo" class="logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="history.html">History</a>
      <a href="gallery.html">Gallery</a>
      <a href="events.html">Events</a>
      <a href="donations.html">Donations</a>
      <a href="enquiry.html">Enquiry</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>
    <p>Send us a message and we will get back to you.</p>

    <section class="form-section">
      <form id="contactForm" novalidate>
        <div class="field">
          <label for="cname">Your name</label>
          <input type="text" id="cname" required>
          <span class="error"></span>
        </div>

        <div class="field">
          <label for="cemail">Your email</label>
          <input type="email" id="cemail" required>
          <span class="error"></span>
        </div>

        <div class="field">
          <label for="cphone">Your phone number</label>
          <input type="tel" id="cphone" required pattern="0[0-9]{9}" maxlength="10">
          <span class="error"></span>
        </div>

        <div class="field">
          <label for="ctype">Type of message</label>
          <select id="ctype" required>
            <option value="">Choose one...</option>
            <option>General question</option>
            <option>Feedback</option>
            <option>Other</option>
          </select>
          <span class="error"></span>
        </div>

        <div class="field">
          <label for="cmessage">Message</label>
          <textarea id="cmessage" rows="5" required minlength="10"></textarea>
          <span class="error"></span>
        </div>

        <button type="submit" class="btn btn-primary">Prepare Email</button>
      </form>

      <div id="emailPreview" class="response" hidden>
        <h2>Your email is ready</h2>
        <pre id="emailText"></pre>
        <a id="sendEmail" class="btn btn-primary" href="#">Send Email</a>
      </div>
    </section>
  </main>

  <footer>
    <p>Instagram: @Motorsundaygroup</p>
    <p>Email: <a href="mailto:msgcharity@gmail.com">msgcharity@gmail.com</a></p>
    <p>&copy; 2026 MSG Blanket Drive. All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
